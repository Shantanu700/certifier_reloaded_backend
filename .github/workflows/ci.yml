name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: certifier
          POSTGRES_USER: certifier
          POSTGRES_PASSWORD: certifier
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U certifier -d certifier"
          --health-interval 2s
          --health-retries 30
    env:
      SECRET_KEY: ci-only-not-a-secret
      POSTGRES_DB: certifier
      POSTGRES_USER: certifier
      POSTGRES_PASSWORD: certifier
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Make migrations (they aren't committed)
        run: uv run manage.py makemigrations
      - run: uv run manage.py check
      - name: Test
        run: uv run manage.py test modules.core.tests modules.certificates.tests

  # Every commit in a pull request needs a DCO sign-off from its author (CONTRIBUTING.md); bot commits are exempt.
  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Every commit is signed off by its author
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          status=0
          for c in $(git rev-list --no-merges "$BASE..$HEAD"); do
            author=$(git show -s --format='%ae' "$c")
            # Bots (Dependabot and co.) sign off with a different address than they author with.
            case "$author" in *"[bot]@users.noreply.github.com") continue ;; esac
            if ! git show -s --format='%(trailers:key=Signed-off-by,valueonly)' "$c" | grep -qiF "<$author>"; then
              echo "::error::$(git show -s --format='%h %s' "$c"): no Signed-off-by for $author. Sign off with git commit -s (see CONTRIBUTING.md)."
              status=1
            fi
          done
          exit $status

[project]
name = "certifier-reloaded"
version = "0.1.0"
description = "Django API for designing, issuing and verifying certificates"
readme = "README.md"
requires-python = ">=3.13"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
dependencies = [
    "boto3>=1.34",
    "celery>=5.6.3",
    "cloudinary>=1.41",
    "cryptography>=50.0.2",
    "django>=6.0.3",
    "django-sslserver-v2>=1.0",
    "djangorestframework>=3.16.1",
    "drf-spectacular>=0.29.0",
    "google-auth[requests]>=2.0",
    "gunicorn>=23",
    "pillow>=12.3.0",
    "psycopg2-binary>=2.9.11",
    "pydantic>=2.12.5",
    "pymupdf>=1.28.2",
    "python-dotenv>=1.2.2",
    "redis>=8.1.0",
    "requests>=2.34.2",
    "segno>=1.6.6",
    "uuid6>=2025.0.1",
    "whitenoise>=6.9",
]

[dependency-groups]
dev = [
    "ruff==0.17.1",
]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
# Pyflakes plus pycodestyle's error-level checks: real bugs (unused imports, undefined names), not style.
# Pinned rather than ruff's defaults so a ruff upgrade can't change what CI enforces; widen a rule at a time.
select = ["E4", "E7", "E9", "F"]
